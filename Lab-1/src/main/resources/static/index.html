<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Sort — Lab 1</title>

    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;display:flex;justify-content:center;padding:40px 16px}
        .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:32px;width:100%;max-width:520px}
        h1{font-size:1.4rem;margin-bottom:24px;text-align:center}
        label{display:block;font-weight:600;margin-bottom:4px;font-size:.9rem}
        select,input[type="number"],input[type="text"]{width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:6px;font-size:.95rem;margin-bottom:16px}
        select:disabled,input:disabled{background:#f3f4f6;color:#9ca3af}
        .checkbox-group{display:flex;align-items:center;gap:8px;margin-bottom:16px}
        .checkbox-group input{width:18px;height:18px}
        .radio-group{display:flex;gap:24px;margin-bottom:16px}
        .radio-group label{font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:0}
        .section-label{font-weight:600;font-size:.9rem;margin-bottom:8px}
        .source-section{border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:16px}
        hr{border:none;border-top:1px solid #e5e7eb;margin:16px 0}
        .hint{font-size:.8rem;color:#6b7280;margin-top:-12px;margin-bottom:4px}
        button{width:100%;padding:10px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
        button:hover{background:#4338ca}
        .result{margin-top:24px;padding:16px;border-radius:8px;background:#f9fafb;border:1px solid #e5e7eb;display:none}
        .result h2{font-size:1rem;margin-bottom:8px}
        .duration{color:#16a34a;font-weight:600}
        .array-output{margin-top:8px;max-height:200px;overflow-y:auto;word-break:break-all;font-family:monospace;font-size:.85rem}
        .error{margin-top:16px;padding:12px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;display:none}
    </style>
</head>

<body>

<div class="card">

    <h1>Merge Sort</h1>

    <form id="sortForm">

        <label for="implementation">Реалізація</label>
        <select id="implementation">
            <option value="SEQUENTIAL">SEQUENTIAL</option>
            <option value="PARALLEL">PARALLEL</option>
        </select>

        <label for="threads">Кількість потоків</label>
        <select id="threads" disabled></select>
        <p class="hint">Доступно тільки для PARALLEL</p>

        <hr>

        <div class="section-label">Джерело даних</div>

        <div class="radio-group">
            <label><input type="radio" name="source" value="generate" checked> Генерувати масив</label>
            <label><input type="radio" name="source" value="file"> Зчитати з файлу</label>
        </div>

        <div class="source-section">

            <div id="panelGenerate">
                <label for="generateLength">Довжина масиву</label>
                <input type="number" id="generateLength" min="1" max="100000000" value="1000">
            </div>

            <div id="panelFile" style="display:none">
                <label for="sourceFilePath">Шлях до файлу</label>
                <input type="text" id="sourceFilePath" placeholder="D:\data\array.json" disabled>
                <p class="hint">JSON масив цілих чисел. Напр. [3,1,4,7]</p>
            </div>

        </div>

        <hr>

        <div class="checkbox-group">
            <input type="checkbox" id="includeArray">
            <label for="includeArray">Включити відсортований масив у відповідь</label>
        </div>

        <label for="fileName">Назва файлу</label>
        <input type="text" id="fileName" required>

        <button type="submit" id="submitBtn">Сортувати</button>

    </form>

    <div class="error" id="error"></div>

    <div class="result" id="result">
        <h2>Результат</h2>
        <p>Час виконання: <span class="duration" id="duration"></span></p>
        <div class="array-output" id="sortedArray"></div>
    </div>

</div>

<script>
    const form = document.getElementById('sortForm')
    const resultDiv = document.getElementById('result')
    const errorDiv = document.getElementById('error')
    const durationSpan = document.getElementById('duration')
    const sortedArrayDiv = document.getElementById('sortedArray')

    const implementation = document.getElementById('implementation')
    const threadsSelect = document.getElementById('threads')

    const panelGenerate = document.getElementById('panelGenerate')
    const panelFile = document.getElementById('panelFile')
    const generateLen = document.getElementById('generateLength')
    const sourceFile = document.getElementById('sourceFilePath')

    let maxThreads = 1

    async function loadCapabilities() {
        try {
            const res = await fetch('/merge-sort/capabilities')
            if (!res.ok) throw new Error('capabilities fetch failed')
            const caps = await res.json()
            maxThreads = Number(caps.maxThreads) || 1
        } catch (e) {
            maxThreads = 1
        }
    }

    function fillThreadsSelect(max) {
        threadsSelect.innerHTML = ''
        for (let i = 1; i <= max; i++) {
            const opt = document.createElement('option')
            opt.value = String(i)
            opt.textContent = String(i)
            threadsSelect.appendChild(opt)
        }
        threadsSelect.value = '1'
    }

    function syncThreadsEnabled() {
        threadsSelect.disabled = implementation.value !== 'PARALLEL'
    }

    document.querySelectorAll('input[name="source"]').forEach(radio => {
        radio.addEventListener('change', () => {
            const isFile = radio.value === 'file' && radio.checked
            panelGenerate.style.display = isFile ? 'none' : 'block'
            panelFile.style.display = isFile ? 'block' : 'none'
            generateLen.disabled = isFile
            sourceFile.disabled = !isFile
        })
    })

    implementation.addEventListener('change', () => {
        syncThreadsEnabled()
    })

    form.addEventListener('submit', async e => {
        e.preventDefault()

        resultDiv.style.display = 'none'
        errorDiv.style.display = 'none'

        const isFile = document.querySelector('input[name="source"]:checked').value === 'file'
        const impl = implementation.value

        const body = {
            implementation: impl,
            includeSortedArrayInResponse: document.getElementById('includeArray').checked,
            fileName: document.getElementById('fileName').value.trim(),
            ...(impl === "PARALLEL" ? { threads: parseInt(threadsSelect.value, 10) } : {}),
            ...(isFile
                ? { sourceFilePath: sourceFile.value.trim() }
                : { arrayLengthToGenerate: parseInt(generateLen.value, 10) })
        }

        try {
            const res = await fetch('/merge-sort', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })

            if (!res.ok) {
                const err = await res.text()
                throw new Error(err)
            }

            const data = await res.json()

            durationSpan.textContent = data.durationInMs + " мс"
            sortedArrayDiv.textContent = data.sortedArray || "—"

            resultDiv.style.display = 'block'
        } catch (err) {
            errorDiv.textContent = err.message
            errorDiv.style.display = 'block'
        }
    })

    ;(async () => {
        await loadCapabilities()
        fillThreadsSelect(maxThreads)
        syncThreadsEnabled()
    })()
</script>

</body>
</html>
